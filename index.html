<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><title>原状回復 判定マニュアル｜試用版</title><style>
:root{--ink:#17324d;--blue:#1767a5;--light:#eef4f9;--line:#dbe4eb;--muted:#64788a}*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#1c2e3d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:15px}button,input{font:inherit}button{cursor:pointer}header{background:#102a43;color:white;padding:19px 18px 15px;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #102a4320}.eyebrow{font-size:10px;letter-spacing:.14em;color:#a7c9e4}h1{font-size:18px;margin:5px 0 13px;letter-spacing:.01em}.search{width:100%;padding:12px 14px;border-radius:12px;border:0;background:white;outline:none}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.tab{padding:10px 1px;border:1px solid #607e95;background:#21415c;color:#d7e8f4;border-radius:9px;font-size:13px}.tab.active{background:#fff;color:#0e4f86;font-weight:700}.wrap{max-width:760px;margin:auto;padding:17px 14px 110px}.summary{display:flex;justify-content:space-between;align-items:center;color:#627689;font-size:12px;margin-bottom:13px}.section{background:white;border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden;box-shadow:0 2px 7px #112d4310}.sectionHead{padding:15px;display:flex;align-items:center;gap:10px;font-weight:750;color:var(--ink);background:#fff;border:0;width:100%;text-align:left}.letter{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#e5f0f9;color:#146399;font-size:13px;flex-shrink:0}.chev{margin-left:auto;color:#8193a1}.items{border-top:1px solid #eef1f5;padding:4px 10px 10px}.item{display:flex;align-items:center;width:100%;border:0;border-bottom:1px solid #eef1f5;background:white;text-align:left;padding:12px 7px;gap:11px;color:#344c60;font-size:14px}.item:last-child{border-bottom:0}.number{font-size:11px;color:#8395a5;min-width:19px}.item .arr{margin-left:auto;color:#9baebb}.chip{font-size:10px;background:#eaf5ed;color:#267546;padding:3px 6px;border-radius:6px;white-space:nowrap}.empty{color:#8795a2;padding:15px;font-size:13px}.overlay{position:fixed;inset:0;background:#071b2a88;z-index:20;display:none;align-items:flex-end}.overlay.open{display:flex}.modal{width:100%;max-width:760px;max-height:94dvh;overflow:auto;margin:0 auto;background:#fff;border-radius:19px 19px 0 0;padding:0 0 env(safe-area-inset-bottom)}.modalTop{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:2;padding:16px 17px;display:flex;gap:12px;align-items:center}.modalTitle{font-size:17px;font-weight:750;line-height:1.45}.breadcrumb{font-size:11px;color:var(--muted);margin-bottom:4px}.close{margin-left:auto;background:#eef3f7;border:0;border-radius:50%;width:34px;height:34px;flex-shrink:0;font-size:22px;color:#36566e}.modalBody{padding:17px}.notice{background:#fff7e8;border:1px solid #f1d9a7;color:#7b5a20;padding:11px;border-radius:10px;font-size:12px;line-height:1.6;margin-bottom:17px}.label{font-size:12px;color:#61768a;font-weight:750;margin:19px 0 9px}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{background:#eef3f6;border-radius:10px;overflow:hidden;border:1px solid #e0e7ed}.photo svg{display:block;width:100%;height:auto}.photoCaption{padding:9px;font-size:12px;line-height:1.5;color:#455e72}.placeholder{height:140px;display:grid;place-items:center;text-align:center;color:#8597a6;font-size:13px;background:repeating-linear-gradient(135deg,#f0f4f7,#f0f4f7 12px,#e8eef2 12px,#e8eef2 24px)}.field{background:#f5f8fb;border-radius:10px;padding:13px;line-height:1.75;font-size:13px}.field strong{color:#234b68}.nav{display:flex;gap:10px;margin-top:22px}.nav button{flex:1;background:#e9f2fa;border:0;color:#135b91;border-radius:10px;padding:13px;font-weight:700}.nav button:disabled{opacity:.35}.footer{color:#718495;text-align:center;font-size:11px;padding:25px 12px}.noresults{text-align:center;padding:45px 15px;color:#718495}.hint{font-size:12px;color:#728596;margin:0 0 12px}@media(min-width:800px){.overlay{align-items:center}.modal{border-radius:18px;max-height:88vh}}@media(prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(18px);opacity:.8}to{transform:translateY(0);opacity:1}}}
</style></head><body><header><div class="eyebrow">PROPERTY MANAGEMENT · FIELD GUIDE</div><h1>原状回復 判定マニュアル <span style="font-size:10px;font-weight:400;color:#b8d2e4">試用版</span></h1><input id="search" class="search" type="search" placeholder="項目を検索（例：クロス、水栓、扉）" aria-label="項目を検索"><nav class="tabs" id="tabs"></nav></header><main class="wrap"><div class="summary"><span id="status"></span><span>項目をタップして詳細を表示</span></div><div id="content"></div><div class="footer">原状回復部位別判定マニュアル · 操作確認用プロトタイプ<br>判定基準・写真は未確定です</div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="項目の詳細"><div class="modal"><div class="modalTop"><div><div class="breadcrumb" id="crumb"></div><div class="modalTitle" id="title"></div></div><button class="close" id="close" aria-label="閉じる">×</button></div><div class="modalBody"><div class="notice">試用版：以下の判定説明・画像は動作確認用の例示です。正式な社内判定基準ではありません。</div><div class="label">写真・損傷例</div><div class="photos" id="photos"></div><div class="label">確認ポイント</div><div class="field" id="check"></div><div class="label">推奨対応・負担区分</div><div class="field" id="action"></div><div class="nav"><button id="prev">← 前の項目</button><button id="next">次の項目 →</button></div></div></div></div><script>
const DATA={"設備": {"キッチン": ["コンロ", "レンジフード・換気扇", "水栓", "排水トラップ", "シンク", "キッチンパネル", "手元灯", "その他"], "浴室": ["浴槽", "水栓", "シャワーヘッド", "浴室乾燥機・換気扇", "浴室内照明", "鏡", "扉", "排水", "その他"], "洗面台": ["ボウル", "水栓", "鏡", "洗面台付属照明"], "トイレ": ["便器", "便座", "タンク", "換気扇", "ペーパーホルダー"], "洗濯機置場": ["防水パン", "水栓", "排水トラップ", "排水エルボ"], "エアコン": ["本体", "リモコン", "配管穴", "室外機架台"], "ガス給湯器・電気温水器": ["本体", "リモコン", "配管"], "電気関係・弱電関係・その他": ["照明器具", "インターホン・チャイム", "スイッチ・コンセント・通信端子", "分電盤・ブレーカー", "火災警報器"]}, "建具": {"玄関扉": ["扉本体・枠", "ハンドル・丁番・ストッパー・ドアガード", "ドアクローザー", "錠前・シリンダー・鍵", "郵便受け"], "室内扉": ["扉本体・枠", "ハンドル・引手・丁番・ストッパー"], "開口部": ["サッシ・戸車", "窓枠", "ガラス", "網戸", "クレセント錠", "カーテンレール", "換気口"], "収納・クローゼット・下駄箱・押入": ["扉", "丁番", "取手", "棚板", "受け金具", "ハンガーパイプ", "障子枠", "襖紙・障子紙", "内部"]}, "表層": {"クロス": ["壁（視認性高い箇所）", "壁（視認性低い箇所）", "天井"], "巾木": ["視認性高い箇所", "視認性低い箇所"], "床": ["居室床・リビング床", "玄関床", "洗面所床・脱衣室床・トイレ床", "畳"]}, "環境": {"バルコニー": ["隔て板", "排水口", "物干し", "その他"], "臭気・衛生": [], "特殊": []}};
const all=[];Object.entries(DATA).forEach(([cat,groups])=>Object.entries(groups).forEach(([group,items])=>{if(items.length){items.forEach((name,i)=>all.push({cat,group,name,num:i+1}));}else{all.push({cat,group,name:'',num:0,sectionOnly:true})}}));
let active='設備',filtered=all,current=-1;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wallSVG=(severe)=>`<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg"><rect width="240" height="160" fill="#e6e9e8"/><path d="M0 25H240M0 80H240M0 135H240" stroke="#d7dcda" stroke-width="1"/>${severe?'<path d="M95 15L119 35 107 58 135 82 114 110 140 146" stroke="#837d75" stroke-width="6" fill="none"/><path d="M95 15L119 35 107 58 135 82 114 110 140 146" stroke="#faf9f3" stroke-width="3" fill="none"/>':'<path d="M70 85Q100 74 130 86M77 98Q109 87 150 95" stroke="#b5b7b2" stroke-width="5" opacity=".7" fill="none"/>'}<text x="10" y="150" font-size="10" fill="#63717a">イメージ図</text></svg>`;
const tapSVG=`<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg"><rect width="240" height="160" fill="#eaf0f4"/><rect x="15" y="122" width="210" height="24" rx="5" fill="#bac9d3"/><path d="M96 115V73Q96 38 130 38H161" stroke="#8196a7" stroke-width="17" fill="none" stroke-linecap="round"/><path d="M155 38H194" stroke="#8196a7" stroke-width="12" stroke-linecap="round"/><rect x="114" y="20" width="32" height="9" rx="4" fill="#637f92"/><path d="M181 65L177 81" stroke="#64a9d7" stroke-width="5" stroke-linecap="round"/><text x="10" y="150" font-size="10" fill="#63717a">イメージ図</text></svg>`;
function isDemo(o){return o.cat==='表層'&&o.group==='クロス'&&o.name.startsWith('壁（')||o.cat==='設備'&&o.group==='キッチン'&&o.name==='水栓'}
function render(){const q=$('search').value.trim().toLowerCase();$('tabs').innerHTML=Object.keys(DATA).map((c,i)=>`<button class="tab ${active===c?'active':''}" data-cat="${esc(c)}">${['①','②','③','④'][i]} ${c}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()});filtered=all.filter(o=>(q||o.cat===active)&&(o.cat+' '+o.group+' '+o.name).toLowerCase().includes(q));$('status').textContent=q?`検索結果 ${filtered.length} 件`:`${active} · ${filtered.length} 項目`;const cats=q?Object.keys(DATA):[active];let output='';cats.forEach(cat=>{const groups=DATA[cat];Object.entries(groups).forEach(([group,items],i)=>{const matches=filtered.filter(o=>o.cat===cat&&o.group===group);if(!matches.length)return;const letter=cat==='表層'||cat==='環境'?'':String.fromCharCode(65+i);output+=`<section class="section"><button class="sectionHead" aria-expanded="true"><span class="letter">${letter||'•'}</span><span>${q?cat+' ／ ':''}${esc(group)}</span><span class="chev">⌄</span></button><div class="items">${matches.map(o=>`<button class="item" data-id="${all.indexOf(o)}"><span class="number">${o.num||'–'}</span><span>${esc(o.name||'項目未設定')}</span>${isDemo(o)?'<span class="chip">例あり</span>':''}<span class="arr">›</span></button>`).join('')}</div></section>`})});$('content').innerHTML=output||'<div class="noresults">該当する項目がありません</div>';document.querySelectorAll('.item').forEach(b=>b.onclick=()=>openItem(Number(b.dataset.id)));document.querySelectorAll('.sectionHead').forEach(b=>b.onclick=()=>{const p=b.nextElementSibling;const hide=p.hidden;p.hidden=!hide;b.setAttribute('aria-expanded',String(hide));b.querySelector('.chev').textContent=hide?'⌄':'›'});}
function openItem(idx){current=idx;const o=all[idx];$('crumb').textContent=o.cat+' › '+o.group;$('title').textContent=o.name||o.group;let photos='',check='',action='';if(isDemo(o)&&o.cat==='表層'){photos=`<div class="photo">${wallSVG(false)}<div class="photoCaption">例① 軽微な擦れ・汚れ</div></div><div class="photo">${wallSVG(true)}<div class="photoCaption">例② 破れ・剥がれ</div></div>`;check='損傷の種類、範囲、位置、視認性、清掃で除去可能かを確認する。<br><strong>写真と実測寸法を記録する。</strong>';action='清掃で改善するか、部分補修・張替えが必要かを検討。借主・貸主の負担区分は原因、経年変化、契約内容等を別途確認して判断する。'}else if(isDemo(o)){photos=`<div class="photo">${tapSVG}<div class="photoCaption">水栓の確認イメージ</div></div><div class="photo"><div class="placeholder">現場写真<br>追加予定</div><div class="photoCaption">不具合例の写真枠</div></div>`;check='漏水、吐水・止水、ハンドルの動作、ぐらつき、表面の劣化を確認する。';action='清掃・調整・部品交換・本体交換の必要性を調査。負担区分は原因と契約条件を確認して判断する。'}else{photos='<div class="photo"><div class="placeholder">写真①<br>追加予定</div><div class="photoCaption">軽度の例</div></div><div class="photo"><div class="placeholder">写真②<br>追加予定</div><div class="photoCaption">重度の例</div></div>';check='この項目の確認ポイントは未登録です。今後、実際の現場写真・社内基準を追加します。';action='未設定：修理・交換の基準、および借主／貸主負担の判断参考を追加予定。'}$('photos').innerHTML=photos;$('check').innerHTML=check;$('action').innerHTML=action;const index=filtered.indexOf(o);$('prev').disabled=index<=0;$('next').disabled=index<0||index>=filtered.length-1;$('overlay').classList.add('open');document.body.style.overflow='hidden';}
function close(){ $('overlay').classList.remove('open');document.body.style.overflow=''; }$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};$('prev').onclick=()=>{let i=filtered.indexOf(all[current]);if(i>0)openItem(all.indexOf(filtered[i-1]))};$('next').onclick=()=>{let i=filtered.indexOf(all[current]);if(i<filtered.length-1)openItem(all.indexOf(filtered[i+1]))};$('search').addEventListener('input',render);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
</script></body></html>
